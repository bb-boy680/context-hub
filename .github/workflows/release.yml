# Build every distributable form on a tag, and keep them on one Release.
#
# Tags are pushed by hand and are the release version: the manifests in the
# repository may lag behind, and each build job stamps the tag version into
# both before packaging. After publishing, the bot opens `release/version-sync`
# so the manifests catch up through the protected main branch. A version with a
# prerelease suffix (`v0.2.0-beta.1`) is published as a GitHub pre-release, so
# the desktop updater does not offer it to stable users. The CLI crosses to
# five targets from one Linux runner; the desktop app has to be built on each
# OS because electron-builder needs that platform's toolchain. A manual run
# stops before publishing, which keeps the workflow usable without creating a
# tag.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  # The publish job opens the manifest sync pull request.
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The tag names the release version. The manifests are only a development
  # copy; the build jobs stamp this version into them before packaging so the
  # About row, the CLI and the update feed all agree.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      prerelease: ${{ steps.read.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: read
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "tag must be vX.Y.Z or vX.Y.Z-suffix, got $GITHUB_REF_NAME" >&2
              exit 1
            fi
          else
            VERSION=$(node -p "require('./package.json').version")
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          case "$VERSION" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

  # Same gate as the pull request workflow: nothing is packaged until the tree
  # lints, typechecks, tests and builds on one runner.
  checks:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  cli:
    needs: [version, checks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Use the tag version
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          node -e '
            const fs = require("node:fs")
            for (const file of ["package.json", "apps/desktop/package.json"]) {
              const data = JSON.parse(fs.readFileSync(file, "utf8"))
              data.version = process.env.VERSION
              fs.writeFileSync(file, JSON.stringify(data, null, 2) + "\n")
            }
          '
      - run: pnpm --filter web build
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: pnpm --filter web build:cli
      - name: Smoke test the Linux binary
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          ./apps/web/release/cli/context-hub-linux-x64 --port 5299 &
          pid=$!
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:5299/ > /dev/null; then break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:5299/ | grep -q 'id="root"'
          curl -sf http://127.0.0.1:5299/hub/about | grep -qF "\"version\":\"$VERSION\""
          kill "$pid"
      - uses: actions/upload-artifact@v4
        with:
          name: cli-binaries
          path: apps/web/release/cli/*
          if-no-files-found: error

  desktop:
    needs: [version, checks]
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Use the tag version
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          node -e '
            const fs = require("node:fs")
            for (const file of ["package.json", "apps/desktop/package.json"]) {
              const data = JSON.parse(fs.readFileSync(file, "utf8"))
              data.version = process.env.VERSION
              fs.writeFileSync(file, JSON.stringify(data, null, 2) + "\n")
            }
          '
      - run: pnpm build
      - name: Build the desktop installer
        run: pnpm --filter @context-hub/desktop exec electron-builder --config electron-builder.config.mjs --publish never
        env:
          # Signing and notarization stay off unless the repository owns the
          # certificates and Apple credentials. Empty secrets keep CI unsigned.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ runner.os == 'macOS' && secrets.CSC_LINK != '' && 'true' || 'false' }}
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.AppImage
            apps/desktop/release/latest*.yml
            apps/desktop/release/*.blockmap
          if-no-files-found: error

  publish:
    needs: [version, cli, desktop]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      # `gh release create --generate-notes` runs git to find the previous tag,
      # and the manifest sync below works from main. fetch-depth 0 keeps every
      # tag available to both.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          TAG="$GITHUB_REF_NAME"
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "$PRERELEASE" = "true" ]; then
              gh release edit "$TAG" --prerelease
            fi
          elif [ "$PRERELEASE" = "true" ]; then
            gh release create "$TAG" --title "$TAG" --generate-notes --prerelease
          else
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" dist-artifacts/* --clobber
      # main is protected: the manifests catch up through a pull request rather
      # than a direct push. The branch is rebuilt from main on every release so
      # an unmerged sync PR always names the newest tag.
      - name: Open the version sync pull request
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          BRANCH=release/version-sync
          node -e '
            const fs = require("node:fs")
            for (const file of ["package.json", "apps/desktop/package.json"]) {
              const data = JSON.parse(fs.readFileSync(file, "utf8"))
              data.version = process.env.VERSION
              fs.writeFileSync(file, JSON.stringify(data, null, 2) + "\n")
            }
          '
          if git diff --quiet -- package.json apps/desktop/package.json; then
            echo "manifests already carry $VERSION"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add package.json apps/desktop/package.json
          git commit -m "chore(release): v$VERSION"
          git push --force origin "$BRANCH"

          PR=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -z "$PR" ]; then
            gh pr create --base main --head "$BRANCH" \
              --title "chore(release): v$VERSION" \
              --body "Sync the root and desktop manifests with tag v$VERSION."
          else
            gh pr edit "$PR" --title "chore(release): v$VERSION"
          fi
